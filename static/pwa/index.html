<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Le chemin de base est injecté par `flutter build web --base-href` (cf.
    build_web.sh) : la PWA est servie sous /invoice_qr_scanner/static/pwa/.
  -->
  <base href="/invoice_qr_scanner/static/pwa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scanner de factures certifiées DGI et liaison aux ordres de transit — ICP">
  <meta name="theme-color" content="#1565C0">

  <!-- iPhone : iOS ignore une grande partie du manifeste. Ces balises sont ce
       qui donne son nom et son icône à l'application une fois ajoutée à
       l'écran d'accueil (Safari → Partager → Sur l'écran d'accueil). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Facture Scanner">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Facture Scanner</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
